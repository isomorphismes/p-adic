name: Witt MIRO APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/witt-miro-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build inputs
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"

      - name: Build stripped MIRO-only native APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ANDROID_COMPILE_SDK: "36"
          ANDROID_ABI: armeabi-v7a
          WITT_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
          WITT_KEYSTORE_TYPE: PKCS12
          WITT_KEY_ALIAS: wegert-debug
          WITT_STORE_PASSWORD: wegert-debug
          WITT_KEY_PASSWORD: wegert-debug
          WITT_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
        run: |
          bash android/build-native.sh
          bash android/build-apk.sh

      - name: Retain APK
        uses: actions/upload-artifact@v4
        with:
          name: witt-miro-apk
          path: |
            build/android/witt-miro-armeabi-v7a.apk
            build/android/witt-miro-armeabi-v7a.contents.txt
            build/android/witt-miro-armeabi-v7a.sha256
            build/android/armeabi-v7a/libwitt.so
          if-no-files-found: error
